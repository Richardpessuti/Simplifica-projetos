name: Preços de eletrodomésticos (diário)

on:
  schedule:
    - cron: "0 11 * * *"  # 08:00 no horário de Brasília (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar-precos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: precos-eletrodomesticos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar coleta de preços
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
        run: python -m scraper.main

      - name: Commitar planilha atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico.xlsx
          git diff --cached --quiet || git commit -m "Atualiza preços de $(date -u +%Y-%m-%d)"
          git push
